name: Web build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo-doctor
      - name: Export web production build
        run: npm run build:web
